name: ${COMPOSE_PROJECT_NAME:-argws-scout-portainer-production}

services:
  postgres:
    image: ${ARGWS_SCOUT_POSTGRES_IMAGE:?Define GHCR Postgres image}
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scout}
      POSTGRES_USER: ${POSTGRES_USER:-scout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging: &default-logging
      driver: json-file
      options: { max-size: 10m, max-file: "5" }
    networks: [scout]

  redis:
    image: ${ARGWS_SCOUT_REDIS_IMAGE:?Define GHCR Redis image}
    pull_policy: always
    restart: unless-stopped
    command:
      [
        redis-server,
        --appendonly,
        "yes",
        --requirepass,
        "${REDIS_PASSWORD:?Generate REDIS_PASSWORD}",
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Generate REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging
    networks: [scout]

  rabbitmq:
    image: ${ARGWS_SCOUT_RABBITMQ_IMAGE:?Define GHCR RabbitMQ image}
    pull_policy: always
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-scout}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Generate RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/5672"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 90s
    logging: *default-logging
    networks: [scout]

  garage:
    image: ${ARGWS_SCOUT_GARAGE_IMAGE:?Define GHCR Garage image}
    pull_policy: always
    restart: unless-stopped
    entrypoint: [/garage]
    command: [-c, /etc/garage-config/garage.toml, server, --single-node]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Generate GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?Generate GARAGE_ADMIN_TOKEN}
    volumes:
      - garage-meta-data:/var/lib/garage/meta
      - garage-object-data:/var/lib/garage/data
      - garage-config-data:/etc/garage-config:ro
    depends_on:
      garage-config-init: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, /garage, -c, /etc/garage-config/garage.toml, status]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging: *default-logging
    networks: [scout]

  garage-config-init:
    image: ghcr.io/${SCOUT_IMAGE_OWNER:-wkarts}/argws-scout-garage-init:${SCOUT_TAG:-stable}
    pull_policy: always
    restart: "no"
    network_mode: none
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Generate GARAGE_RPC_SECRET}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        set -eu
        rpc_secret="${GARAGE_RPC_SECRET:-}"
        if [ "${#rpc_secret}" -ne 64 ]; then
          echo "ERRO: GARAGE_RPC_SECRET deve conter exatamente 64 caracteres hexadecimais (32 bytes). Gere com openssl rand -hex 32 e preserve a chave." >&2
          exit 1
        fi
        case "$rpc_secret" in
          *[!0-9a-fA-F]*)
            echo "ERRO: GARAGE_RPC_SECRET contem caracteres nao hexadecimais. Gere com openssl rand -hex 32." >&2
            exit 1
            ;;
        esac
        umask 022
        if [ ! -s /config/garage.toml ]; then
          cat > /config/garage.toml <<'EOF'
        metadata_dir = "/var/lib/garage/meta"
        data_dir = "/var/lib/garage/data"
        db_engine = "lmdb"
        replication_factor = 1
        rpc_bind_addr = "[::]:3901"
        rpc_public_addr = "garage:3901"

        [s3_api]
        api_bind_addr = "[::]:3900"
        s3_region = "us-east-1"
        root_domain = ".s3.garage"

        [admin]
        api_bind_addr = "[::]:3903"
        EOF
        fi
        test -s /config/garage.toml
    volumes:
      - garage-config-data:/config
    logging: *default-logging

  garage-init:
    image: ghcr.io/${SCOUT_IMAGE_OWNER:-wkarts}/argws-scout-garage-init:${SCOUT_TAG:-stable}
    pull_policy: always
    restart: "no"
    network_mode: "service:garage"
    depends_on:
      garage: { condition: service_healthy }
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        if ! garage -c /etc/garage-config/garage.toml key info "$${S3_ACCESS_KEY_ID}" >/dev/null 2>&1; then
          garage -c /etc/garage-config/garage.toml key import --yes -n argws-scout "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}";
        fi;
        if ! garage -c /etc/garage-config/garage.toml bucket info "$${S3_BUCKET}" >/dev/null 2>&1; then
          garage -c /etc/garage-config/garage.toml bucket create "$${S3_BUCKET}";
        fi;
        garage -c /etc/garage-config/garage.toml bucket allow --read --write "$${S3_BUCKET}" --key "$${S3_ACCESS_KEY_ID}"
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Generate GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?Generate GARAGE_ADMIN_TOKEN}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-scout-artifacts}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Generate S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-scout-artifacts}
    volumes:
      - garage-config-data:/etc/garage-config:ro
      - garage-meta-data:/var/lib/garage/meta:ro
    logging: *default-logging

  migrate:
    image: ghcr.io/${SCOUT_IMAGE_OWNER:-wkarts}/argws-scout-migrate:${SCOUT_TAG:-stable}
    pull_policy: always
    restart: "no"
    command: [sh, -lc, "pnpm db:generate && pnpm db:migrate"]
    env_file: [stack.env]
    environment:
      SCOUT_RECOVERY_SMTP_HOST: ""
      SCOUT_RECOVERY_SMTP_PORT: ""
      SCOUT_RECOVERY_SMTP_SECURE: ""
      SCOUT_RECOVERY_SMTP_USERNAME: ""
      SCOUT_RECOVERY_SMTP_PASSWORD: ""
      SCOUT_RECOVERY_SMTP_FROM_EMAIL: ""
      SCOUT_RECOVERY_SMTP_FROM_NAME: ""
      DATABASE_URL: postgresql://${POSTGRES_USER:-scout}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scout}?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    logging: *default-logging
    networks: [scout]

  bootstrap:
    image: ghcr.io/${SCOUT_IMAGE_OWNER:-wkarts}/argws-scout-migrate:${SCOUT_TAG:-stable}
    pull_policy: always
    profiles: [maintenance]
    restart: "no"
    command: [pnpm, db:seed]
    env_file: [stack.env]
    environment:
      SCOUT_RECOVERY_SMTP_HOST: ""
      SCOUT_RECOVERY_SMTP_PORT: ""
      SCOUT_RECOVERY_SMTP_SECURE: ""
      SCOUT_RECOVERY_SMTP_USERNAME: ""
      SCOUT_RECOVERY_SMTP_PASSWORD: ""
      SCOUT_RECOVERY_SMTP_FROM_EMAIL: ""
      SCOUT_RECOVERY_SMTP_FROM_NAME: ""
      DATABASE_URL: postgresql://${POSTGRES_USER:-scout}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scout}?schema=public
    depends_on:
      migrate: { condition: service_completed_successfully }
    logging: *default-logging
    networks: [scout]

  api:
    image: ghcr.io/${SCOUT_IMAGE_OWNER:-wkarts}/argws-scout-api:${SCOUT_TAG:-stable}
    pull_policy: always
    restart: unless-stopped
    command: [pnpm, --filter, "@argws/scout-api", start]
    env_file: [stack.env]
    environment: &app-environment
      NODE_ENV: production
      SCOUT_ENV: ${SCOUT_ENV:-develop}
      SCOUT_VERSION: ${SCOUT_VERSION:-0.5.2}
      DATABASE_URL: postgresql://${POSTGRES_USER:-scout}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scout}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-scout}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      S3_ENDPOINT: http://garage:3900
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-scout-artifacts}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-scout-artifacts}
      S3_REGION: ${S3_REGION:-us-east-1}
      SCOUT_CORS_ORIGINS: ${SCOUT_PUBLIC_URL:?Set SCOUT_PUBLIC_URL}
      SCOUT_COOKIE_SECURE: ${SCOUT_COOKIE_SECURE:-true}
      SCOUT_ALLOW_HTTP: ${SCOUT_ALLOW_HTTP:-false}
      SCOUT_TRUST_PROXY_HOPS: ${SCOUT_TRUST_PROXY_HOPS:-1}
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      garage-init: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    logging: *default-logging
    networks: [scout]

  manager:
    image: ghcr.io/${SCOUT_IMAGE_OWNER:-wkarts}/argws-scout-manager:${SCOUT_TAG:-stable}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SCOUT_MANAGER_PORT:-8080}:80"
    depends_on:
      api: { condition: service_healthy }
      docs: { condition: service_started }
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1/health >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks: [scout]

  docs:
    image: ghcr.io/${SCOUT_IMAGE_OWNER:-wkarts}/argws-scout-docs:${SCOUT_TAG:-stable}
    pull_policy: always
    restart: unless-stopped
    logging: *default-logging
    networks: [scout]

  dispatcher:
    image: ghcr.io/${SCOUT_IMAGE_OWNER:-wkarts}/argws-scout-dispatcher:${SCOUT_TAG:-stable}
    pull_policy: always
    restart: unless-stopped
    command: [pnpm, --filter, "@argws/scout-dispatcher", start]
    env_file: [stack.env]
    environment:
      SCOUT_RECOVERY_SMTP_HOST: ""
      SCOUT_RECOVERY_SMTP_PORT: ""
      SCOUT_RECOVERY_SMTP_SECURE: ""
      SCOUT_RECOVERY_SMTP_USERNAME: ""
      SCOUT_RECOVERY_SMTP_PASSWORD: ""
      SCOUT_RECOVERY_SMTP_FROM_EMAIL: ""
      SCOUT_RECOVERY_SMTP_FROM_NAME: ""
      <<: *app-environment
    depends_on:
      api: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    logging: *default-logging
    networks: [scout]

  worker:
    image: ghcr.io/${SCOUT_IMAGE_OWNER:-wkarts}/argws-scout-worker:${SCOUT_TAG:-stable}
    pull_policy: always
    restart: unless-stopped
    command: [pnpm, --filter, "@argws/scout-worker", start]
    env_file: [stack.env]
    environment:
      SCOUT_RECOVERY_SMTP_HOST: ""
      SCOUT_RECOVERY_SMTP_PORT: ""
      SCOUT_RECOVERY_SMTP_SECURE: ""
      SCOUT_RECOVERY_SMTP_USERNAME: ""
      SCOUT_RECOVERY_SMTP_PASSWORD: ""
      SCOUT_RECOVERY_SMTP_FROM_EMAIL: ""
      SCOUT_RECOVERY_SMTP_FROM_NAME: ""
      <<: *app-environment
    depends_on:
      api: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      garage-init: { condition: service_completed_successfully }
    logging: *default-logging
    networks: [scout]

  browser-worker:
    image: ghcr.io/${SCOUT_IMAGE_OWNER:-wkarts}/argws-scout-browser-worker:${SCOUT_TAG:-stable}
    pull_policy: always
    restart: unless-stopped
    init: true
    shm_size: 1gb
    mem_limit: 2g
    cpus: 2
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=512m"]
    command: [pnpm, --filter, "@argws/scout-browser-worker", start]
    env_file: [stack.env]
    environment:
      SCOUT_RECOVERY_SMTP_HOST: ""
      SCOUT_RECOVERY_SMTP_PORT: ""
      SCOUT_RECOVERY_SMTP_SECURE: ""
      SCOUT_RECOVERY_SMTP_USERNAME: ""
      SCOUT_RECOVERY_SMTP_PASSWORD: ""
      SCOUT_RECOVERY_SMTP_FROM_EMAIL: ""
      SCOUT_RECOVERY_SMTP_FROM_NAME: ""
      <<: *app-environment
      SCOUT_BROWSER_CONCURRENCY: ${SCOUT_BROWSER_CONCURRENCY:-1}
    depends_on:
      api: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      garage-init: { condition: service_completed_successfully }
    logging: *default-logging
    networks: [scout]

  scheduler:
    image: ghcr.io/${SCOUT_IMAGE_OWNER:-wkarts}/argws-scout-scheduler:${SCOUT_TAG:-stable}
    pull_policy: always
    restart: unless-stopped
    command: [pnpm, --filter, "@argws/scout-scheduler", start]
    env_file: [stack.env]
    environment:
      SCOUT_RECOVERY_SMTP_HOST: ""
      SCOUT_RECOVERY_SMTP_PORT: ""
      SCOUT_RECOVERY_SMTP_SECURE: ""
      SCOUT_RECOVERY_SMTP_USERNAME: ""
      SCOUT_RECOVERY_SMTP_PASSWORD: ""
      SCOUT_RECOVERY_SMTP_FROM_EMAIL: ""
      SCOUT_RECOVERY_SMTP_FROM_NAME: ""
      <<: *app-environment
    depends_on:
      api: { condition: service_healthy }
    logging: *default-logging
    networks: [scout]

  webhook-worker:
    image: ghcr.io/${SCOUT_IMAGE_OWNER:-wkarts}/argws-scout-webhook-worker:${SCOUT_TAG:-stable}
    pull_policy: always
    restart: unless-stopped
    command: [pnpm, --filter, "@argws/scout-webhook-worker", start]
    env_file: [stack.env]
    environment:
      SCOUT_RECOVERY_SMTP_HOST: ""
      SCOUT_RECOVERY_SMTP_PORT: ""
      SCOUT_RECOVERY_SMTP_SECURE: ""
      SCOUT_RECOVERY_SMTP_USERNAME: ""
      SCOUT_RECOVERY_SMTP_PASSWORD: ""
      SCOUT_RECOVERY_SMTP_FROM_EMAIL: ""
      SCOUT_RECOVERY_SMTP_FROM_NAME: ""
      <<: *app-environment
    depends_on:
      api: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    logging: *default-logging
    networks: [scout]

networks:
  scout:
    name: ${COMPOSE_PROJECT_NAME:-argws-scout-portainer-production}-network
    driver: bridge

volumes:
  garage-config-data:
    name: ${COMPOSE_PROJECT_NAME:-argws-scout-portainer-production}-garage-config
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME:-argws-scout-portainer-production}-postgres
  redis-data:
    name: ${COMPOSE_PROJECT_NAME:-argws-scout-portainer-production}-redis
  rabbitmq-data:
    name: ${COMPOSE_PROJECT_NAME:-argws-scout-portainer-production}-rabbitmq
  garage-meta-data:
    name: ${COMPOSE_PROJECT_NAME:-argws-scout-portainer-production}-garage-meta
  garage-object-data:
    name: ${COMPOSE_PROJECT_NAME:-argws-scout-portainer-production}-garage-data
