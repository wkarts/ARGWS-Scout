name: argws-scout-${SCOUT_ENV:-develop}

services:
  postgres:
    image: postgres:17.11-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scout}
      POSTGRES_USER: ${POSTGRES_USER:-scout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em .env}
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-scout} -d ${POSTGRES_DB:-scout}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [scout]

  redis:
    image: redis:7.4.9-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?Defina REDIS_PASSWORD em .env}",
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./volumes/redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [scout]

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-scout}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD em .env}
    volumes:
      - ./volumes/rabbitmq:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/5672"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks: [scout]

  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    entrypoint: ["/garage"]
    command: ["-c", "/etc/garage.toml", "server", "--single-node"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Defina GARAGE_RPC_SECRET em .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?Defina GARAGE_ADMIN_TOKEN em .env}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - ./volumes/garage/meta:/var/lib/garage/meta
      - ./volumes/garage/data:/var/lib/garage/data
    ports:
      - "127.0.0.1:3900:3900"
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [scout]

  garage-init:
    build:
      context: .
      dockerfile: Dockerfile.garage-init
    restart: "no"
    network_mode: "service:garage"
    depends_on:
      garage: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-ec"]
    command: >-
      if ! garage key info "$${S3_ACCESS_KEY_ID}" >/dev/null 2>&1; then
        garage key import --yes -n argws-scout "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}";
      fi;
      if ! garage bucket info "$${S3_BUCKET}" >/dev/null 2>&1; then
        garage bucket create "$${S3_BUCKET}";
      fi;
      garage bucket allow --read --write "$${S3_BUCKET}" --key "$${S3_ACCESS_KEY_ID}"
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Defina GARAGE_RPC_SECRET em .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?Defina GARAGE_ADMIN_TOKEN em .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-scout-artifacts}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Defina S3_SECRET_ACCESS_KEY em .env}
      S3_BUCKET: ${S3_BUCKET:-scout-artifacts}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - ./volumes/garage/meta:/var/lib/garage/meta:ro

  migrate:
    build: { context: ., dockerfile: Dockerfile }
    restart: "no"
    command: ["sh", "-lc", "pnpm db:generate && pnpm db:migrate"]
    env_file: [.env]
    environment:
      SCOUT_RECOVERY_SMTP_HOST: ""
      SCOUT_RECOVERY_SMTP_PORT: ""
      SCOUT_RECOVERY_SMTP_SECURE: ""
      SCOUT_RECOVERY_SMTP_USERNAME: ""
      SCOUT_RECOVERY_SMTP_PASSWORD: ""
      SCOUT_RECOVERY_SMTP_FROM_EMAIL: ""
      SCOUT_RECOVERY_SMTP_FROM_NAME: ""
      DATABASE_URL: postgresql://${POSTGRES_USER:-scout}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scout}?schema=public
    depends_on: { postgres: { condition: service_healthy } }
    networks: [scout]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["pnpm", "--filter", "@argws/scout-api", "start"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scout}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scout}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-scout}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      S3_ENDPOINT: http://garage:3900
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-scout-artifacts}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-scout-artifacts}
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      garage-init: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [scout]

  manager:
    build:
      context: .
      dockerfile: Dockerfile.manager
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SCOUT_MANAGER_PORT:-8081}:80"
    depends_on:
      api: { condition: service_healthy }
      docs: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [scout]

  docs:
    build:
      context: .
      dockerfile: Dockerfile.docs
    restart: unless-stopped
    networks: [scout]

  dispatcher:
    build: { context: ., dockerfile: Dockerfile }
    restart: unless-stopped
    command: ["pnpm", "--filter", "@argws/scout-dispatcher", "start"]
    env_file: [.env]
    environment:
      SCOUT_RECOVERY_SMTP_HOST: ""
      SCOUT_RECOVERY_SMTP_PORT: ""
      SCOUT_RECOVERY_SMTP_SECURE: ""
      SCOUT_RECOVERY_SMTP_USERNAME: ""
      SCOUT_RECOVERY_SMTP_PASSWORD: ""
      SCOUT_RECOVERY_SMTP_FROM_EMAIL: ""
      SCOUT_RECOVERY_SMTP_FROM_NAME: ""
      DATABASE_URL: postgresql://${POSTGRES_USER:-scout}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scout}?schema=public
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-scout}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    depends_on:
      api: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [scout]

  worker:
    build: { context: ., dockerfile: Dockerfile }
    restart: unless-stopped
    command: ["pnpm", "--filter", "@argws/scout-worker", "start"]
    env_file: [.env]
    environment:
      SCOUT_RECOVERY_SMTP_HOST: ""
      SCOUT_RECOVERY_SMTP_PORT: ""
      SCOUT_RECOVERY_SMTP_SECURE: ""
      SCOUT_RECOVERY_SMTP_USERNAME: ""
      SCOUT_RECOVERY_SMTP_PASSWORD: ""
      SCOUT_RECOVERY_SMTP_FROM_EMAIL: ""
      SCOUT_RECOVERY_SMTP_FROM_NAME: ""
      DATABASE_URL: postgresql://${POSTGRES_USER:-scout}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scout}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-scout}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      S3_ENDPOINT: http://garage:3900
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-scout-artifacts}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-scout-artifacts}
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      api: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      garage-init: { condition: service_completed_successfully }
    networks: [scout]

  browser-worker:
    build: { context: ., dockerfile: Dockerfile.browser-worker }
    restart: unless-stopped
    init: true
    shm_size: 1gb
    mem_limit: 2g
    cpus: 2
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=512m"]
    command: ["pnpm", "--filter", "@argws/scout-browser-worker", "start"]
    env_file: [.env]
    environment:
      SCOUT_RECOVERY_SMTP_HOST: ""
      SCOUT_RECOVERY_SMTP_PORT: ""
      SCOUT_RECOVERY_SMTP_SECURE: ""
      SCOUT_RECOVERY_SMTP_USERNAME: ""
      SCOUT_RECOVERY_SMTP_PASSWORD: ""
      SCOUT_RECOVERY_SMTP_FROM_EMAIL: ""
      SCOUT_RECOVERY_SMTP_FROM_NAME: ""
      DATABASE_URL: postgresql://${POSTGRES_USER:-scout}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scout}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-scout}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      S3_ENDPOINT: http://garage:3900
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-scout-artifacts}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-scout-artifacts}
      S3_REGION: ${S3_REGION:-us-east-1}
      SCOUT_BROWSER_CONCURRENCY: 1
      SCOUT_BROWSER_CHROMIUM_SANDBOX: ${SCOUT_BROWSER_CHROMIUM_SANDBOX:-false}
    depends_on:
      api: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      garage-init: { condition: service_completed_successfully }
    networks: [scout]

  scheduler:
    build: { context: ., dockerfile: Dockerfile }
    restart: unless-stopped
    command: ["pnpm", "--filter", "@argws/scout-scheduler", "start"]
    env_file: [.env]
    environment:
      SCOUT_RECOVERY_SMTP_HOST: ""
      SCOUT_RECOVERY_SMTP_PORT: ""
      SCOUT_RECOVERY_SMTP_SECURE: ""
      SCOUT_RECOVERY_SMTP_USERNAME: ""
      SCOUT_RECOVERY_SMTP_PASSWORD: ""
      SCOUT_RECOVERY_SMTP_FROM_EMAIL: ""
      SCOUT_RECOVERY_SMTP_FROM_NAME: ""
      DATABASE_URL: postgresql://${POSTGRES_USER:-scout}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scout}?schema=public
    depends_on: { api: { condition: service_healthy } }
    networks: [scout]

  webhook-worker:
    build: { context: ., dockerfile: Dockerfile }
    restart: unless-stopped
    command: ["pnpm", "--filter", "@argws/scout-webhook-worker", "start"]
    env_file: [.env]
    environment:
      SCOUT_RECOVERY_SMTP_HOST: ""
      SCOUT_RECOVERY_SMTP_PORT: ""
      SCOUT_RECOVERY_SMTP_SECURE: ""
      SCOUT_RECOVERY_SMTP_USERNAME: ""
      SCOUT_RECOVERY_SMTP_PASSWORD: ""
      SCOUT_RECOVERY_SMTP_FROM_EMAIL: ""
      SCOUT_RECOVERY_SMTP_FROM_NAME: ""
      DATABASE_URL: postgresql://${POSTGRES_USER:-scout}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scout}?schema=public
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-scout}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    depends_on:
      api: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [scout]

networks:
  scout:
    name: argws-scout-${SCOUT_ENV:-develop}-net
