openapi: 3.1.0
info:
  title: ARGWS Scout API
  version: 0.7.0
  description: REST API para espaços de trabalho, coleta web e publicação via Connect|API, com canais e instâncias WhatsApp isolados logicamente.
servers:
  - url: /v1
security:
  - ScoutSession: []
  - ScoutToken: []
paths:
  /auth/login:
    post:
      security: []
      summary: Autentica usuário ou inicia desafio MFA.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, writeOnly: true }
                tenantSlug: { type: string }
      responses:
        "200":
          description: Sessão ou indicação MFA_REQUIRED/MFA_SETUP_REQUIRED.
        "401":
          description: Credenciais inválidas.
  /auth/password/forgot:
    post:
      security: []
      summary: Solicita redefinição de senha sem revelar se o e-mail existe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          {
            description: Solicitação aceita; o SMTP global envia o link quando a conta existe.,
          }
  /auth/password/reset:
    post:
      security: []
      summary: Redefine senha com token de uso único válido por 30 minutos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, writeOnly: true }
                password: { type: string, minLength: 16, writeOnly: true }
      responses:
        "200": { description: Senha alterada e sessões revogadas. }
        "400": { description: Token expirado ou já utilizado. }
  /auth/mfa/setup:
    post:
      security: [{ PreAuth: [] }]
      summary: Cria segredo TOTP pendente e QR de configuração.
      responses:
        "200": { description: QR Code e segredo manual. }
  /auth/mfa/confirm:
    post:
      security: [{ PreAuth: [] }]
      summary: Confirma TOTP e completa configuração obrigatória.
      requestBody:
        $ref: "#/components/requestBodies/MfaCode"
      responses:
        "200": { description: MFA ativada e sessão criada. }
  /auth/mfa/verify:
    post:
      security: [{ PreAuth: [] }]
      summary: Confirma TOTP ou código reserva de uso único durante login.
      requestBody:
        $ref: "#/components/requestBodies/MfaChallenge"
      responses:
        "200": { description: Sessão criada. }
  /auth/refresh:
    post:
      security: []
      summary: Rotaciona sessão usando cookie HTTP-only.
      responses:
        "200": { description: Sessão renovada. }
        "401": { description: Refresh expirado ou revogado. }
  /auth/logout:
    post:
      security: []
      summary: Revoga refresh atual e limpa cookies.
      responses:
        "204": { description: Sessão encerrada. }
  /auth/me:
    get:
      summary: Retorna usuário, perfil, role e tenant ativo.
      responses:
        "200": { description: Identidade autenticada. }
  /profile:
    patch:
      summary: Atualiza nome e dados não sensíveis do perfil.
      requestBody:
        $ref: "#/components/requestBodies/ProfileUpdate"
      responses:
        "200": { description: Perfil atualizado. }
  /profile/mfa/recovery-codes/regenerate:
    post:
      security: [{ ScoutSession: [] }]
      summary: Substitui códigos reserva e confirma TOTP atual.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200": { description: Códigos novos exibidos uma única vez. }
  /profile/mfa/disable:
    post:
      security: [{ ScoutSession: [] }]
      summary: Desativa MFA após confirmar senha e TOTP; OWNER mantém MFA pela política padrão.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string, writeOnly: true }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200": { description: MFA desativada e outras sessões encerradas. }
        "409": { description: MFA obrigatória pela política. }
  /integrations/smtp:
    get:
      security: [{ ScoutSession: [] }]
      summary: Consulta estado do SMTP de envio; configuração completa só para OWNER/ADMIN.
      responses:
        "200":
          {
            description: Configuração sem o segredo e estado do relay global de recuperação.,
          }
    put:
      security: [{ ScoutSession: [] }]
      summary: Salva SMTP de envio independente para esta organização.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [host, port, secure, authentication, fromEmail, fromName]
              properties:
                host: { type: string, maxLength: 255 }
                port: { type: integer, minimum: 1, maximum: 65535 }
                secure: { type: boolean }
                authentication: { type: boolean }
                username: { type: string, maxLength: 254 }
                password:
                  {
                    type: string,
                    writeOnly: true,
                    description: "Opcional para manter a senha já cifrada.",
                  }
                fromEmail: { type: string, format: email }
                fromName: { type: string, maxLength: 120 }
      responses:
        "200":
          {
            description: Configuração cifrada salva; a senha nunca é retornada.,
          }
    delete:
      security: [{ ScoutSession: [] }]
      summary: Remove SMTP de envio desta organização.
      responses:
        "204": { description: Integração removida. }
  /integrations/smtp/test:
    post:
      security: [{ ScoutSession: [] }]
      summary: Verifica o relay configurado e envia e-mail de teste; OWNER/ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient]
              properties:
                recipient: { type: string, format: email }
      responses:
        "200": { description: E-mail de teste enviado. }
  /overview:
    get:
      summary: Retorna contadores e jobs recentes do tenant.
      responses:
        "200": { description: Visão geral. }
  /instances:
    get:
      summary: Lista instâncias ativas do tenant.
      responses:
        "200": { description: Lista de instâncias. }
    post:
      summary: Cria instância genérica.
      requestBody:
        $ref: "#/components/requestBodies/InstanceCreate"
      responses:
        "201": { description: Instância criada. }
  /instances/{instanceId}:
    get:
      parameters:
        [
          {
            in: path,
            name: instanceId,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      summary: Retorna instância, fontes, jobs recentes e schedules.
      responses:
        "200": { description: Instância encontrada. }
    patch:
      parameters:
        [
          {
            in: path,
            name: instanceId,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      summary: Atualiza dados ou desativa instância.
      responses:
        "200": { description: Instância atualizada. }
  /instances/{instanceId}/sources:
    get:
      parameters:
        [
          {
            in: path,
            name: instanceId,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      summary: Lista fontes.
      responses:
        "200": { description: Fontes da instância. }
    post:
      parameters:
        [
          {
            in: path,
            name: instanceId,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      summary: Cria fonte HTTP ou Playwright com host allowlist.
      requestBody:
        $ref: "#/components/requestBodies/SourceCreate"
      responses:
        "201": { description: Fonte criada. }
  /instances/{instanceId}/jobs:
    post:
      parameters:
        [
          {
            in: path,
            name: instanceId,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      summary: Cria job e outbox atomicamente.
      requestBody:
        $ref: "#/components/requestBodies/JobCreate"
      responses:
        "202": { description: Job aceito para execução. }
  /instance-templates:
    get:
      security: [{ ScoutSession: [] }]
      summary: Lista modelos prontos e editáveis de coleta.
      description: Os modelos são exemplos de páginas públicas; não integram APIs comerciais privadas sem autenticação.
      responses:
        "200":
          description: Dez modelos, com ID, metadados, URLs de exemplo e configuração inicial.
        "403":
          description: Requer sessão do Manager.
  /instance-templates/{templateId}/create:
    post:
      security: [{ ScoutSession: [] }]
      summary: Cria instância e fonte a partir de um modelo no espaço atual.
      description: Requer OWNER, ADMIN ou OPERATOR. Não inicia a coleta automaticamente.
      parameters:
        - in: path
          name: templateId
          required: true
          schema: { type: string }
          example: amazon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, query]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                description: { type: string, maxLength: 500 }
                query: { type: string, minLength: 2, maxLength: 100 }
                source:
                  type: object
                  properties:
                    name: { type: string, minLength: 2, maxLength: 120 }
                    url: { type: string, format: uri }
                    selector: { type: string, maxLength: 500 }
                    engine: { type: string, enum: [HTTP, PLAYWRIGHT] }
                    requestIntervalMs:
                      { type: integer, minimum: 1000, maximum: 300000 }
                    captureScreenshot: { type: boolean }
      responses:
        "201": { description: Instância e fonte criadas atomicamente. }
        "400":
          {
            description: Configuração ou URL rejeitada pelas políticas de segurança.,
          }
        "403": { description: Perfil sem permissão. }
        "404": { description: Modelo não encontrado. }
        "409": { description: Identificador de instância indisponível. }
  /jobs:
    get:
      summary: Lista jobs recentes; results:read libera conteúdo para tokens.
      responses:
        "200": { description: Jobs com cursor. }
  /jobs/{jobId}:
    get:
      parameters:
        [
          {
            in: path,
            name: jobId,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      summary: Retorna estado, resultado, source e tentativas.
      responses:
        "200": { description: Job encontrado. }
  /jobs/{jobId}/email:
    post:
      security: [{ ScoutSession: [] }]
      summary: Envia resultado concluído usando o SMTP da organização.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, subject, text]
              properties:
                to: { type: string, format: email }
                subject: { type: string, maxLength: 200 }
                text: { type: string, maxLength: 30000 }
      responses:
        "200": { description: Resultado enviado e ação auditada. }
        "409": { description: Job não concluído ou sem SMTP de envio. }
        "502": { description: SMTP recusou ou não entregou a mensagem. }
  /jobs/{jobId}/artifacts/{artifactId}:
    get:
      parameters:
        - {
            in: path,
            name: jobId,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            in: path,
            name: artifactId,
            required: true,
            schema: { type: string, format: uuid },
          }
      summary: Faz stream de artifact após checagem results:read.
      responses:
        "200": { description: Bytes do arquivo. }
  /whatsapp:
    get:
      security: [{ ScoutSession: [] }]
      summary: Retorna estado sem segredos, instâncias e permissões WhatsApp da organização.
      responses:
        "200": { description: Configuração mascarada e catálogo de instâncias. }
  /whatsapp/config:
    put:
      security: [{ ScoutSession: [] }]
      summary: Testa e salva a URL e a chave administrativa da Connect API.
      description: OWNER/ADMIN. O segredo é cifrado no backend e não volta na resposta.
      requestBody:
        $ref: "#/components/requestBodies/WhatsAppConnectConfig"
      responses:
        "200": { description: Conexão validada e catálogo sincronizado. }
        "400": { description: URL ou credenciais inválidas. }
        "502":
          { description: Connect API inacessível ou rejeitou a solicitação. }
  /whatsapp/sync:
    post:
      security: [{ ScoutSession: [] }]
      summary: Sincroniza metadados e tokens de instâncias WhatsApp.
      description: OWNER/ADMIN. Tokens remotos são cifrados antes de persistir.
      responses:
        "200": { description: Catálogo sincronizado. }
        "409": { description: Connect API ainda não configurada. }
  /whatsapp/instances:
    post:
      security: [{ ScoutSession: [] }]
      summary: Cria uma instância WhatsApp Baileys com token individual gerado pela Scout.
      description: OWNER/ADMIN. A chave administrativa só é usada pelo backend.
      requestBody:
        $ref: "#/components/requestBodies/WhatsAppInstanceCreate"
      responses:
        "201": { description: Instância criada; o token não é retornado. }
        "409":
          {
            description: Instância já vinculada ou Connect API não configurada.,
          }
        "502":
          {
            description: Resultado remoto incerto; sincronize antes de repetir.,
          }
  /whatsapp/instances/import:
    post:
      security: [{ ScoutSession: [] }]
      summary: Valida e vincula uma instância existente por seu token próprio.
      description: OWNER/ADMIN. O token nunca é retornado nem persistido em claro.
      requestBody:
        $ref: "#/components/requestBodies/WhatsAppInstanceImport"
      responses:
        "201": { description: Instância vinculada. }
        "404": { description: Instância ou token não encontrados. }
  /whatsapp/default:
    put:
      security: [{ ScoutSession: [] }]
      summary: Define ou limpa a instância padrão da organização.
      description: OWNER/ADMIN. O envio ainda aceita uma instância escolhida por publicação.
      requestBody:
        $ref: "#/components/requestBodies/WhatsAppDefault"
      responses:
        "200": { description: Instância padrão atualizada. }
  /whatsapp/instances/{name}/{action}:
    post:
      security: [{ ScoutSession: [] }]
      summary: Pareia, consulta estado, reinicia ou desconecta uma instância.
      description: OWNER/ADMIN. Usa o token individual da instância.
      parameters:
        - { in: path, name: name, required: true, schema: { type: string } }
        - {
            in: path,
            name: action,
            required: true,
            schema: { type: string, enum: [connect, status, restart, logout] },
          }
      responses:
        "200":
          {
            description: Resultado Connect API; tokens são removidos da resposta Scout.,
          }
        "404": { description: Instância não vinculada à organização. }
  /whatsapp/instances/{name}:
    delete:
      security: [{ ScoutSession: [] }]
      summary: Exclui permanentemente uma instância remota.
      description: OWNER/ADMIN. A exclusão é auditada e remove a instância do seletor.
      parameters:
        - { in: path, name: name, required: true, schema: { type: string } }
      responses:
        "204": { description: Instância removida. }
  /whatsapp/publications:
    get:
      security: [{ ScoutSession: [] }]
      summary: Lista o histórico recente de publicações WhatsApp sem revelar números completos nem mensagem.
      responses:
        "200": { description: Até 50 envios recentes da organização. }
    post:
      security: [{ ScoutSession: [] }]
      summary: Publica o resultado de uma coleta concluída em uma instância e número escolhidos.
      description: OWNER/ADMIN/OPERATOR. UNKNOWN significa que o resultado externo é incerto; a Scout não repete automaticamente.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 80 }
      requestBody:
        $ref: "#/components/requestBodies/WhatsAppPublicationCreate"
      responses:
        "201":
          { description: Tentativa registrada como SENT, FAILED ou UNKNOWN. }
        "200":
          {
            description: Chave de idempotência já processada; o resultado salvo é retornado sem reenvio.,
          }
        "400":
          { description: Chave de idempotência, número ou mensagem inválidos. }
        "404": { description: Job concluído não encontrado no tenant. }
        "409":
          {
            description: Chave repetida com outro conteúdo ou instância indisponível.,
          }
  /whatsapp/channel-actions:
    get:
      security: [{ ScoutSession: [] }]
      summary: Histórico de envios de status e compartilhamento de produtos do próprio espaço.
      description: Nunca retorna token, mensagem ou número de destinatário.
      responses:
        "200": { description: Até 100 ações registradas, ordenadas por data. }
  /whatsapp/instances/{name}/statuses:
    get:
      security: [{ ScoutSession: [] }]
      summary: Consulta status publicados exclusivamente pela instância vinculada ao espaço.
      parameters:
        - { in: path, name: name, required: true, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 100, default: 1 } }
      responses:
        "200": { description: Status da instância vinculada, sem credenciais. }
        "404": { description: Instância de outro espaço ou não vinculada. }
    post:
      security: [{ ScoutSession: [] }]
      summary: Publica status de texto ou foto após confirmação explícita.
      description: Disponível apenas quando a implementação do provider suporta envio de status. Nunca repete automaticamente envios de resultado incerto.
      parameters:
        - { in: path, name: name, required: true, schema: { type: string } }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 80 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, content, confirmed]
              properties:
                type: { type: string, enum: [text, image] }
                content: { type: string, minLength: 1, maxLength: 4096 }
                confirmed: { type: boolean, enum: [true] }
                backgroundColor: { type: string, example: "#1d4ed8" }
                font: { type: integer, minimum: 1, maximum: 5 }
                caption: { type: string, maxLength: 1024 }
                allContacts: { type: boolean, default: false }
                statusJidList:
                  type: array
                  maxItems: 100
                  items: { type: string, pattern: "^[1-9][0-9]{7,14}$" }
      responses:
        "201": { description: Status enviado. }
        "200": { description: Requisição já registrada sem novo disparo. }
        "202": { description: Resposta remota incerta; nenhum reenvio automático. }
        "400": { description: Destinatário ou payload inválido. }
        "404": { description: Instância não vinculada ao espaço. }
  /whatsapp/instances/{name}/catalog:
    get:
      security: [{ ScoutSession: [] }]
      summary: Consulta o catálogo WhatsApp Business em modo somente leitura.
      parameters:
        - { in: path, name: name, required: true, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 30, default: 10 } }
        - { in: query, name: cursor, schema: { type: string, maxLength: 1024 } }
      responses:
        "200": { description: Produtos e paginação fornecidos pela Connect API. }
        "404": { description: Instância de outro espaço. }
        "502": { description: Catálogo não suportado/indisponível no provider. }
  /whatsapp/instances/{name}/catalog/share:
    post:
      security: [{ ScoutSession: [] }]
      summary: Compartilha um produto selecionado por mensagem de texto com confirmação.
      description: Não cria produtos nativamente no catálogo. Valida destinatário, link HTTPS e idempotência.
      parameters:
        - { in: path, name: name, required: true, schema: { type: string } }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 80 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [number, title, productUrl, confirmed]
              properties:
                number: { type: string, pattern: "^[1-9][0-9]{7,14}$" }
                title: { type: string, minLength: 2, maxLength: 280 }
                productUrl: { type: string, format: uri }
                description: { type: string, maxLength: 1500 }
                confirmed: { type: boolean, enum: [true] }
      responses:
        "201": { description: Compartilhamento confirmado. }
        "200": { description: Idempotency-Key previamente registrada. }
        "202": { description: Envio possivelmente efetuado, sem repetição automática. }
        "400": { description: Produto ou número inválido. }
        "404": { description: Instância indisponível neste espaço. }
  /instances/{instanceId}/tokens:
    get:
      parameters:
        [
          {
            in: path,
            name: instanceId,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      summary: Lista metadados sem segredo.
      responses:
        "200": { description: Tokens ativos. }
    post:
      parameters:
        [
          {
            in: path,
            name: instanceId,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      summary: Cria token por escopo; mostra segredo uma vez.
      requestBody:
        $ref: "#/components/requestBodies/TokenCreate"
      responses:
        "201": { description: Token criado. }
  /instances/{instanceId}/schedules:
    get:
      parameters:
        [
          {
            in: path,
            name: instanceId,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      summary: Lista schedules cron.
      responses:
        "200": { description: Schedules. }
    post:
      parameters:
        [
          {
            in: path,
            name: instanceId,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      summary: Agenda execução recorrente.
      requestBody:
        $ref: "#/components/requestBodies/ScheduleCreate"
      responses:
        "201": { description: Schedule criado. }
  /instances/{instanceId}/webhooks:
    get:
      parameters:
        [
          {
            in: path,
            name: instanceId,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      summary: Lista webhooks sem segredo.
      responses:
        "200": { description: Webhooks da instância. }
    post:
      parameters:
        [
          {
            in: path,
            name: instanceId,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      summary: Cria endpoint HTTPS para eventos de job.
      requestBody:
        $ref: "#/components/requestBodies/WebhookCreate"
      responses:
        "201": { description: Segredo de webhook mostrado uma única vez. }
  /webhooks/{webhookId}/deliveries:
    get:
      parameters:
        [
          {
            in: path,
            name: webhookId,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      summary: Lista tentativas recentes de entrega.
      responses:
        "200": { description: Histórico de deliveries. }
  /users:
    get:
      summary: Lista membros da organização; OWNER e ADMIN.
      responses:
        "200": { description: Usuários e papéis do tenant. }
    post:
      summary: Adiciona usuário à organização.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                email: { type: string, format: email }
                password: { type: string, minLength: 16, writeOnly: true }
                role: { type: string, enum: [ADMIN, OPERATOR, VIEWER] }
      responses:
        "201": { description: Usuário vinculado. }
  /users/{userId}/mfa/reset:
    post:
      parameters:
        [
          {
            in: path,
            name: userId,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      summary: Redefine MFA e revoga sessões do membro; somente OWNER.
      responses:
        "204": { description: MFA redefinido e sessões revogadas. }
  /audit:
    get:
      summary: Lista ações administrativas recentes; OWNER e ADMIN.
      parameters:
        [
          {
            in: query,
            name: cursor,
            required: false,
            schema: { type: string, format: uuid },
          },
        ]
      responses:
        "200": { description: Página de eventos de auditoria. }
  /ops/health:
    get:
      summary: Sonda dependências, backlog e runtime da API; OWNER e ADMIN.
      responses:
        "200":
          description: Diagnóstico operacional do tenant.
          content:
            application/json:
              schema:
                type: object
                required: [status, checkedAt, dependencies, activity, runtime]
                properties:
                  status: { type: string, enum: [healthy, degraded] }
                  checkedAt: { type: string, format: date-time }
                  dependencies:
                    {
                      type: object,
                      additionalProperties:
                        { type: string, enum: [ok, unavailable] },
                    }
                  activity:
                    { type: object, additionalProperties: { type: integer } }
                  runtime: { type: object, additionalProperties: true }
  /content/status:
    get:
      summary: Estado e canais do refinamento de conteúdo.
      responses:
        "200": { description: Estado e formatos de publicação disponíveis. }
        "403": { description: Requer usuário do Manager. }
  /content/instances/{id}/settings:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Configurações do refinamento isoladas por instância.
      responses:
        "200": { description: Configurações atuais. }
        "404": { description: Instância não encontrada. }
    patch:
      summary: Atualiza opções de refinamento da instância (OWNER/ADMIN).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                autoProcess: { type: boolean, default: false }
                query: { type: string, maxLength: 150 }
                onlyRelevant: { type: boolean }
                maxItems: { type: integer, minimum: 1, maximum: 250 }
                createStory: { type: boolean }
                fetchImages: { type: boolean, default: false }
                enrichImages: { type: boolean, default: false }
      responses:
        "200": { description: Configuração atualizada. }
        "403": { description: Permissão de administrador necessária. }
  /content/jobs:
    get:
      summary: Coletas concluídas para refinamento.
      parameters:
        - in: query
          name: instanceId
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Lista de coletas e lotes relacionados. }
  /content/jobs/{jobId}/refine:
    post:
      summary: Enfileira refinamento de Job concluído, sem alterar a coleta.
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query: { type: string }
                onlyRelevant: { type: boolean }
                maxItems: { type: integer, minimum: 1, maximum: 250 }
                createStory: { type: boolean }
                fetchImages: { type: boolean }
                enrichImages: { type: boolean }
      responses:
        "202": { description: Refinamento enfileirado. }
        "200": { description: Lote pré-existente reutilizado. }
        "503": { description: Módulo desativado no ambiente. }
  /content/import:
    post:
      summary: Importa retorno JSON para fonte existente e gera refinamento assíncrono.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [instanceId, sourceId, payload]
              properties:
                instanceId: { type: string, format: uuid }
                sourceId: { type: string, format: uuid }
                payload: { type: object, additionalProperties: true }
                options: { type: object, additionalProperties: true }
      responses:
        "202": { description: Importação registrada e lote enfileirado. }
        "404": { description: Fonte não pertence à instância autorizada. }
  /content/batches:
    get:
      summary: Lotes refinados pertencentes à organização.
      parameters:
        - in: query
          name: instanceId
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Lotes e contadores. }
  /content/batches/{id}:
    get:
      summary: Detalhamento de lote e publicações individuais.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Lote autorizado e até 250 itens. }
        "404": { description: Lote inexistente. }
  /content/identities/{id}/history:
    get:
      summary: Histórico de preços e observações do mesmo conteúdo na instância.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Histórico de até 100 observações. }
  /content/items/{id}/review:
    patch:
      summary: Aprova, retorna a rascunho ou arquiva uma publicação.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [DRAFT, APPROVED, ARCHIVED] }
      responses:
        "200": { description: Revisão registrada; não envia mensagem. }
        "403": { description: Item divergente requer administrador. }
  /content/items/{id}/export:
    get:
      summary: Exporta dados refinados e rascunhos multicanal, sem envio.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          { description: Dados, textos, avisos, mídias e estado de aprovação. }
  /content/items/{id}/media/{kind}:
    get:
      summary: Recupera imagem ou arquivo EML de um item autenticado.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: kind
          required: true
          schema: { type: string, enum: [square, wide, story, eml] }
      responses:
        "200": { description: Arquivo privado do Garage/S3. }
        "404": { description: Artefato não disponível. }
components:
  securitySchemes:
    ScoutSession: { type: apiKey, in: cookie, name: scout_access }
    ScoutToken: { type: http, scheme: bearer, bearerFormat: Scout API token }
    PreAuth: { type: http, scheme: bearer, bearerFormat: MFA pre-auth token }
  requestBodies:
    MfaCode:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code: { type: string, pattern: "^[0-9]{6}$" }
    MfaChallenge:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code:
                {
                  type: string,
                  minLength: 6,
                  maxLength: 32,
                  description: "Código TOTP de seis dígitos ou código reserva de uso único.",
                }
    ProfileUpdate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string, minLength: 2, maxLength: 120 }
              profile: { type: object, additionalProperties: true }
    InstanceCreate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string, minLength: 2, maxLength: 120 }
              slug: { type: string, maxLength: 63 }
              description: { type: string, maxLength: 500 }
              metadata: { type: object, additionalProperties: true }
    SourceCreate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, engine, url, allowedHosts]
            properties:
              name: { type: string, minLength: 2, maxLength: 120 }
              engine: { type: string, enum: [HTTP, PLAYWRIGHT] }
              url:
                {
                  type: string,
                  format: uri,
                  description: "Aceita templates {{input.campo}}.",
                }
              allowedHosts:
                type: array
                minItems: 1
                maxItems: 20
                items: { type: string, format: hostname }
              selector: { type: string, maxLength: 500 }
              respectRobots: { type: boolean, default: true }
              captureScreenshot: { type: boolean, default: false }
              requestIntervalMs:
                { type: integer, minimum: 1000, maximum: 300000, default: 5000 }
    JobCreate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [sourceId]
            properties:
              sourceId: { type: string, format: uuid }
              input: { type: object, additionalProperties: true }
    TokenCreate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, scopes]
            properties:
              name: { type: string, minLength: 2, maxLength: 120 }
              scopes:
                type: array
                minItems: 1
                maxItems: 5
                items:
                  {
                    type: string,
                    enum:
                      [
                        instances:read,
                        sources:read,
                        jobs:create,
                        jobs:read,
                        results:read,
                      ],
                  }
              expiresAt: { type: string, format: date-time }
    ScheduleCreate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [sourceId, name, cron]
            properties:
              sourceId: { type: string, format: uuid }
              name: { type: string, minLength: 2, maxLength: 120 }
              cron: { type: string, minLength: 9, maxLength: 100 }
              timezone: { type: string, default: America/Bahia }
              input: { type: object, additionalProperties: true }
    WebhookCreate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, url, events]
            properties:
              name: { type: string, minLength: 2, maxLength: 120 }
              url:
                {
                  type: string,
                  format: uri,
                  description: "Destino HTTPS público.",
                }
              events:
                type: array
                minItems: 1
                maxItems: 2
                items: { type: string, enum: [job.completed, job.failed] }
    WhatsAppConnectConfig:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [baseUrl]
            properties:
              baseUrl:
                {
                  type: string,
                  format: uri,
                  description: "Endpoint HTTPS público da Connect API.",
                }
              apiKey:
                {
                  type: string,
                  writeOnly: true,
                  description: "Chave administrativa; pode ser omitida para manter a chave cifrada atual.",
                }
    WhatsAppInstanceCreate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string, minLength: 2, maxLength: 120 }
    WhatsAppInstanceImport:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, token]
            properties:
              name: { type: string, minLength: 2, maxLength: 120 }
              token: { type: string, minLength: 8, writeOnly: true }
    WhatsAppDefault:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [instanceName]
            properties:
              instanceName: { type: [string, "null"], maxLength: 120 }
    WhatsAppPublicationCreate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [jobId, instanceName, number, text]
            properties:
              jobId: { type: string, format: uuid }
              instanceName: { type: string, minLength: 2, maxLength: 120 }
              number: { type: string, minLength: 8, maxLength: 24 }
              text: { type: string, minLength: 1, maxLength: 4096 }
