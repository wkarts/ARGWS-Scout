name: Temporary Scout formatting
on:
  push:
    branches: [fix/scout-responsive-global-connect-20261010]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical Prettier to modified sources
        run: pnpm exec prettier --write apps/api/src/global-connect.ts apps/api/src/whatsapp-routes.ts apps/manager/src/App.vue apps/manager/src/style.css apps/manager/src/views/WhatsAppConsole.vue docs/whatsapp-connect-api.md docs/user-manual.md docs/operations.md docs/first-steps.md README.md apps/docs/first-steps.html apps/docs/user-guide.html test/connect-ownership.integration.test.ts test/global-connect.test.ts test/manager-responsive-contract.test.ts compose.yaml ops/deployment/compose.yaml deploy/docker/develop/compose.yaml deploy/docker/production/compose.yaml deploy/dockge/develop/compose.yaml deploy/dockge/production/compose.yaml deploy/cloudpanel/develop/compose.yaml deploy/cloudpanel/production/compose.yaml deploy/portainer/develop/compose.yaml deploy/portainer/production/compose.yaml
      - name: Commit formatted sources
        shell: bash
        run: |
          set -euo pipefail
          git add apps/api/src/global-connect.ts apps/api/src/whatsapp-routes.ts apps/manager/src/App.vue apps/manager/src/style.css apps/manager/src/views/WhatsAppConsole.vue docs/whatsapp-connect-api.md docs/user-manual.md docs/operations.md docs/first-steps.md README.md apps/docs/first-steps.html apps/docs/user-guide.html test/connect-ownership.integration.test.ts test/global-connect.test.ts test/manager-responsive-contract.test.ts compose.yaml ops/deployment/compose.yaml deploy/docker/develop/compose.yaml deploy/docker/production/compose.yaml deploy/dockge/develop/compose.yaml deploy/dockge/production/compose.yaml deploy/cloudpanel/develop/compose.yaml deploy/cloudpanel/production/compose.yaml deploy/portainer/develop/compose.yaml deploy/portainer/production/compose.yaml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format global Connect API and responsive layout"
          git push origin HEAD:refs/heads/fix/scout-responsive-global-connect-20261010
