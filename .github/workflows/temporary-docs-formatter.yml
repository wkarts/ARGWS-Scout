name: Temporary documentation formatter
on:
  push:
    branches: [feat/scout-manager-account-security-onboarding-20261009]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'wkarts/ARGWS-Scout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/docs/first-steps.html apps/docs/user-guide.html apps/docs/index.html apps/scheduler/src/scheduler.ts
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git add apps/docs/first-steps.html apps/docs/user-guide.html apps/docs/index.html apps/scheduler/src/scheduler.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format guide pages and scheduler"
          git push origin HEAD:refs/heads/feat/scout-manager-account-security-onboarding-20261009
