name: Deployment integrity
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  compose-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check bundle and retention contracts
        run: |
          python3 test/deployment-contract.py
          python3 test/actions-cache-retention.py
          python3 scripts/ghcr-bases.py --mode validate --owner wkarts
      - name: Validate every deployment target and channel
        shell: bash
        run: |
          set -euo pipefail
          for target in docker dockge cloudpanel portainer; do
            for channel in develop production; do
              folder="deploy/$target/$channel"
              cp "$folder/.env.example" "$folder/.env"
              if [[ "$target" == portainer ]]; then cp "$folder/.env" "$folder/stack.env"; fi
              docker compose --profile '*' --env-file "$folder/.env" -f "$folder/compose.yaml" config --quiet
              docker compose --profile '*' --env-file "$folder/.env" -f "$folder/compose.yaml" config --format json > /tmp/scout-compose.json
              python3 scripts/validate-compose-model.py "$folder" /tmp/scout-compose.json
            done
          done

  garage-bootstrap-smoke:
    name: Real Garage startup and S3 bucket provisioning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate isolated smoke environment with the Windows Deployer backend
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/argws-scout-deployer/scout_deployer.py generate \
            --target dockge --environment production \
            --output "$RUNNER_TEMP/scout-garage-smoke" \
            --public-url https://scout.example.org \
            --admin-email admin@scout.example.org
          cp "$RUNNER_TEMP/scout-garage-smoke/.env" deploy/dockge/production/.env
      - name: Boot Garage, verify readiness, import key and create bucket
        shell: bash
        run: |
          set -euo pipefail
          cd deploy/dockge/production
          docker compose config --quiet
          docker compose up --abort-on-container-exit --exit-code-from garage-init garage-init
          docker compose run --rm --no-deps --entrypoint /bin/sh garage-config-init -ec 'test -s /config/garage.toml && grep -Fq "replication_factor = 1" /config/garage.toml'
      - name: Show Garage logs on failure
        if: failure()
        shell: bash
        run: |
          cd deploy/dockge/production
          docker compose ps -a || true
          docker compose logs --tail=150 garage-config-init garage garage-init || true
      - name: Cleanup ephemeral smoke containers
        if: always()
        shell: bash
        run: |
          cd deploy/dockge/production
          docker compose down || true
