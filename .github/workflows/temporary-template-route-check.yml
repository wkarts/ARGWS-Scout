name: Temporary template route format verification
on:
  push:
    branches: [feat/scout-marketplace-template-catalog-20261010]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and check templates route
        run: |
          pnpm exec prettier --write apps/api/src/template-routes.ts
          pnpm exec prettier --check apps/api/src/template-routes.ts
      - name: Commit route formatting
        shell: bash
        run: |
          set -euo pipefail
          git add apps/api/src/template-routes.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: enforce canonical formatter on instance template API route"
          git push origin HEAD:refs/heads/feat/scout-marketplace-template-catalog-20261010
