name: Temporary PR38 Formatter
on:
  push:
    branches:
      - fix/deployer-connect-pairing-docs-20261010
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'wkarts/ARGWS-Scout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only files changed in PR 38
        run: pnpm exec prettier --write apps/api/src/connect-api.ts apps/api/src/connect-deletion.ts apps/api/src/whatsapp-routes.ts apps/docs/first-steps.css apps/docs/index.css apps/docs/user-guide.css apps/manager/src/views/WhatsAppConsole.vue test/docs-browser-style.test.ts test/whatsapp-delete.test.ts test/whatsapp-pairing.test.ts
      - name: Save canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          git add apps/api/src/connect-api.ts apps/api/src/connect-deletion.ts apps/api/src/whatsapp-routes.ts apps/docs/first-steps.css apps/docs/index.css apps/docs/user-guide.css apps/manager/src/views/WhatsAppConsole.vue test/docs-browser-style.test.ts test/whatsapp-delete.test.ts test/whatsapp-pairing.test.ts
          if git diff --cached --quiet; then
            echo "Formatting already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: normalize pairing, deletion and docs changes with Prettier"
          git push origin HEAD:refs/heads/fix/deployer-connect-pairing-docs-20261010
