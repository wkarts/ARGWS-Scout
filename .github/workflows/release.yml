name: SemVer release
on:
  workflow_run:
    workflows: ["GHCR application images"]
    types: [completed]
permissions:
  actions: write
  contents: write
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: release-source
      - name: Read originating quality run
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data = json.loads(Path("release-source/source.json").read_text(encoding="utf-8"))
          required = ("source_branch", "source_sha", "source_event", "source_conclusion", "source_run_id")
          missing = [key for key in required if not data.get(key)]
          if missing:
              raise SystemExit("Missing source metadata: " + ", ".join(missing))
          for key in required:
              print("{}={}".format(key, data[key]))
          PY
      - uses: actions/checkout@v4
        if: steps.source.outputs.source_branch == 'main' && steps.source.outputs.source_event == 'push' && steps.source.outputs.source_conclusion == 'success'
        with:
          fetch-depth: 0
          ref: ${{ steps.source.outputs.source_sha }}
      - name: Validate version and workspace contract
        if: steps.source.outputs.source_branch == 'main' && steps.source.outputs.source_event == 'push' && steps.source.outputs.source_conclusion == 'success'
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Only a stable SemVer release is supported: $version" >&2; exit 1; }
          for manifest in package.json apps/*/package.json packages/*/package.json; do
            actual="$(node -p "JSON.parse(require('fs').readFileSync('$manifest', 'utf8')).version")"
            [[ "$actual" == "$version" ]] || { echo "$manifest has $actual; expected $version" >&2; exit 1; }
          done
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Create or verify stable release
        if: steps.source.outputs.source_branch == 'main' && steps.source.outputs.source_event == 'push' && steps.source.outputs.source_conclusion == 'success'
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          RELEASE_VERSION: "${{ steps.version.outputs.value }}"
          RELEASE_COMMIT: ${{ steps.source.outputs.source_sha }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          release_tag="v$RELEASE_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$release_tag:refs/tags/$release_tag"
            tagged_commit="$(git rev-parse "$release_tag^{commit}")"
            [[ "$tagged_commit" == "$RELEASE_COMMIT" ]] || { echo "$release_tag already points at $tagged_commit, expected $RELEASE_COMMIT." >&2; exit 1; }
          else
            git tag -a "$release_tag" "$RELEASE_COMMIT" -m "ARGWS Scout $release_tag"
            git push origin "refs/tags/$release_tag"
          fi
          if ! gh release view "$release_tag" --repo "$GH_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$release_tag" --repo "$GH_REPOSITORY" --title "ARGWS Scout $release_tag" --generate-notes
          fi
          dispatched_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          workflow_path=".github/workflows/deployer-release.yml"
          gh workflow run "$workflow_path" --repo "$GH_REPOSITORY" --ref main -f "release_tag=$release_tag"
          run_id=""
          for attempt in {1..40}; do
            runs="$(gh run list --repo "$GH_REPOSITORY" --workflow "$workflow_path" --branch main --event workflow_dispatch --limit 20 --json databaseId,headSha,createdAt)"
            run_id="$(jq -r --arg sha "$RELEASE_COMMIT" --arg since "$dispatched_at" '[.[] | select(.headSha == $sha and .createdAt >= $since)] | sort_by(.createdAt) | last | .databaseId // empty' <<< "$runs")"
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          [[ -n "$run_id" ]] || { echo "Could not find Windows deployer workflow run for $RELEASE_COMMIT." >&2; exit 1; }
          gh run watch "$run_id" --repo "$GH_REPOSITORY" --exit-status --interval 15
          assets="$(gh release view "$release_tag" --repo "$GH_REPOSITORY" --json assets --jq '.assets[].name')"
          for required in argws-scout-deployer-win-x64.zip argws-scout-deployer-win-x64.exe SHA256SUMS.txt manifest.json; do
            grep -Fxq "$required" <<< "$assets" || { echo "Release asset missing: $required" >&2; exit 1; }
          done
