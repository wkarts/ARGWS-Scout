name: GHCR application images
on:
  workflow_run:
    workflows: ["Quality gates"]
    types: [completed]
    branches: [develop, main]
permissions:
  contents: read
jobs:
  release-source:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Capture the source quality run
        env:
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-source
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          keys = ("SOURCE_BRANCH", "SOURCE_SHA", "SOURCE_EVENT", "SOURCE_CONCLUSION", "SOURCE_RUN_ID")
          data = {key.lower(): os.environ[key] for key in keys}
          Path("release-source/source.json").write_text(json.dumps(data, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: release-source/source.json
          if-no-files-found: error
          retention-days: 7
  ensure-bases:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.head_branch == 'develop' || github.event.workflow_run.head_branch == 'main')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ghcr-sync-infrastructure.yml
    with:
      refresh_existing: false
    secrets: inherit
  publish:
    needs: [ensure-bases]
    permissions:
      contents: read
      packages: write
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: runtime
            dockerfile: Dockerfile
            platforms: linux/amd64,linux/arm64
          - component: manager
            dockerfile: Dockerfile.manager
            platforms: linux/amd64,linux/arm64
          - component: docs
            dockerfile: Dockerfile.docs
            platforms: linux/amd64,linux/arm64
          - component: browser-worker
            dockerfile: Dockerfile.browser-worker
            platforms: linux/amd64
          - component: garage-init
            dockerfile: Dockerfile.garage-init
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.workflow_run.head_sha }}"
      - name: Select channel tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          branch="${{ github.event.workflow_run.head_branch }}"
          version="$(tr -d '\r\n' < VERSION)"
          components=("${{ matrix.component }}")
          if [[ "${{ matrix.component }}" == runtime ]]; then
            components=(runtime api migrate dispatcher worker scheduler webhook-worker)
          fi
          if [[ "$branch" != develop && "$branch" != main ]]; then
            echo "Unsupported source branch: $branch" >&2
            exit 1
          fi
          {
            echo 'value<<TAGS'
            for component in "${components[@]}"; do
              image="ghcr.io/$owner/argws-scout-$component"
              if [[ "$branch" == develop ]]; then
                echo "$image:develop"
              else
                echo "$image:$version"
                if [[ "$version" != *-* ]]; then
                  echo "$image:stable"
                  echo "$image:latest"
                fi
              fi
            done
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for pinned GHCR base images
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          images=(
            "ghcr.io/$owner/argws-scout-postgres:17.11-alpine3.23"
            "ghcr.io/$owner/argws-scout-redis:7.4.9-alpine"
            "ghcr.io/$owner/argws-scout-rabbitmq:4.3.6-management-alpine"
            "ghcr.io/$owner/argws-scout-garage:v2.4.1"
            "ghcr.io/$owner/argws-scout-node:24.21.0-bookworm-slim"
            "ghcr.io/$owner/argws-scout-nginx:1.30.5-alpine"
            "ghcr.io/$owner/argws-scout-playwright:v1.63.0-noble"
            "ghcr.io/$owner/argws-scout-alpine:3.23"
            "ghcr.io/$owner/argws-scout-buildkit:buildx-stable-1"
          )
          for image in "${images[@]}"; do
            ready=false
            for attempt in {1..40}; do
              if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
                ready=true
                break
              fi
              sleep 15
            done
            if [[ "$ready" != true ]]; then
              echo "Pinned GHCR base image is unavailable: $image" >&2
              exit 1
            fi
          done
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=ghcr.io/${{ github.repository_owner }}/argws-scout-buildkit:buildx-stable-1
      - name: Build and publish ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.value }}
          build-args: |
            NODE_BASE=ghcr.io/${{ github.repository_owner }}/argws-scout-node:24.21.0-bookworm-slim
            NGINX_BASE=ghcr.io/${{ github.repository_owner }}/argws-scout-nginx:1.30.5-alpine
            PLAYWRIGHT_BASE=ghcr.io/${{ github.repository_owner }}/argws-scout-playwright:v1.63.0-noble
            GARAGE_BASE=ghcr.io/${{ github.repository_owner }}/argws-scout-garage:v2.4.1
            TOOLS_BASE=ghcr.io/${{ github.repository_owner }}/argws-scout-alpine:3.23
          cache-from: type=gha,scope=argws-scout-buildkit-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=argws-scout-buildkit-${{ matrix.component }}

  cache-retention:
    needs: [publish]
    if: needs.publish.result == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.head_branch == 'develop' || github.event.workflow_run.head_branch == 'main')
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions: { actions: write, contents: read }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Clean stale BuildKit caches only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          PUBLISH_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/actions-cache-retention.py --apply
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-cache-retention-${{ github.run_id }}
          path: build-cache-retention.json
          if-no-files-found: ignore
          retention-days: 30
