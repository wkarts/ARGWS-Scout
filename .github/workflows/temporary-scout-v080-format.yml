name: Temporary Scout v0.8.0 formatter
on:
  push:
    branches: [service-off-refinamento-10102026]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    if: github.repository == 'wkarts/ARGWS-Scout'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only changed release and API contract files
        shell: bash
        run: |
          pnpm exec prettier --write \
            docs/openapi.yaml \
            test/whatsapp-delete.test.ts \
            docs/content-refinement.md \
            docs/release-v0.8.0.md \
            README.md \
            apps/docs/viewer.js \
            .github/workflows/ci.yml
      - name: Commit canonical format on feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add docs/openapi.yaml test/whatsapp-delete.test.ts docs/content-refinement.md docs/release-v0.8.0.md README.md apps/docs/viewer.js .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo "All release files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(release): canonical Prettier formatting for Scout 0.8.0"
          git push origin HEAD:refs/heads/service-off-refinamento-10102026
