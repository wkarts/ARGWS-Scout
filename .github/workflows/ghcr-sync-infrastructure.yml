name: GHCR base images
on:
  workflow_call:
    inputs:
      refresh_existing: {type: boolean, required: false, default: false}
  workflow_dispatch:
    inputs:
      refresh_existing:
        description: Refresh pinned mirrors explicitly
        type: boolean
        default: false
  push:
    branches: [main, develop]
    paths: [.github/workflows/ghcr-sync-infrastructure.yml, .github/ghcr-bases.json, scripts/ghcr-bases.py, Dockerfile*, deploy/**]
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read
  packages: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | skopeo login --authfile "$RUNNER_TEMP/ghcr-auth.json" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
      - name: Ensure mirrored base images exist before application builds
        env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/ghcr-auth.json
          IMAGE_OWNER: ${{ github.repository_owner }}
          REFRESH: ${{ (github.event_name == 'workflow_dispatch' && inputs.refresh_existing) || (github.event_name == 'workflow_call' && inputs.refresh_existing) }}
        run: |
          args=(--mode ensure --owner "$IMAGE_OWNER")
          if [[ "$REFRESH" == true ]]; then args+=(--refresh-existing); fi
          python3 scripts/ghcr-bases.py "${args[@]}"
