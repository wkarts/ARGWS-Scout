name: Scout temporary PR formatter
on:
  push:
    branches: [feat/scout-manager-account-security-onboarding-20261009]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    if: github.repository == 'wkarts/ARGWS-Scout'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format TypeScript, Vue, CSS, Markdown and docs
        run: pnpm exec prettier --write apps/api/src/invitations.ts apps/api/src/protected-user.ts apps/api/src/routes.ts apps/api/src/version.ts apps/api/src/server.ts apps/manager/src/App.vue apps/manager/src/style.css apps/manager/src/views/AccessConsole.vue apps/manager/src/views/OperationsConsole.vue packages/schemas/src/index.ts prisma/seed.ts test/protected-user.test.ts docs/first-steps.md docs/user-manual.md docs/workspace-isolation.md
      - name: Commit formatting to the isolated feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add apps/api/src apps/manager/src packages/schemas/src/index.ts prisma/seed.ts test/protected-user.test.ts docs/first-steps.md docs/user-manual.md docs/workspace-isolation.md
          if git diff --cached --quiet; then
            echo "Formatting is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format Scout Manager and API implementation"
          git push origin HEAD:refs/heads/feat/scout-manager-account-security-onboarding-20261009
