<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f7f9fc" />
    <meta
      name="description"
      content="Documentação navegável do Scout e referência da API"
    />
    <title>Documentação online · ARGWS Scout</title>
    <link rel="stylesheet" href="/docs/viewer.css" />
  </head>
  <body>
    <a class="skip-link" href="#doc-content">Ir para a documentação</a>
    <header class="viewer-header">
      <a href="/docs/" class="viewer-brand"
        ><img src="/docs/brand/logo-horizontal.png" alt="ARGWS Scout"
      /></a>
      <span>Documentação online</span>
      <a href="/docs/">Índice</a>
    </header>
    <div class="viewer-layout">
      <aside class="viewer-sidebar" aria-label="Documentos disponíveis">
        <strong>Conteúdos</strong>
        <nav id="doc-nav"><span>Carregando índice…</span></nav>
      </aside>
      <main class="viewer-main" id="doc-content-wrapper">
        <div class="viewer-breadcrumb">
          Documentação / <span id="doc-heading">Carregando…</span>
        </div>
        <article class="viewer-article" id="doc-content" aria-live="polite">
          <p>Preparando a visualização…</p>
        </article>
        <footer>ARGWS Scout · Documentação para consulta no navegador</footer>
      </main>
    </div>
    <script type="module" src="/docs/viewer.js"></script>
  </body>
</html>
