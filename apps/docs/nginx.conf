server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  # Human-facing docs use viewer.html. Direct source URLs must display inline.
  location ~* \.(md|ya?ml)$ {
    types { text/plain md yaml yml; }
    default_type text/plain;
    add_header Content-Disposition "inline" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # ES modules must be served with a JavaScript MIME type in every Nginx base image.
  location = /viewer-core.mjs {
    types { application/javascript mjs; }
    default_type application/javascript;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  }
}
